services:
  db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_DATABASE: appdb
      MYSQL_USER: appuser
      MYSQL_PASSWORD: apppass
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    image: node:20-slim
    working_dir: /app
    volumes:
      - ./:/app
    ports:
      - "3000:3000"
    environment:
      - DATABASE_URL=mysql://appuser:apppass@db:3306/appdb
      - NODE_ENV=development
      - __VITE_ADDITIONAL_SERVER_ALLOWED_HOSTS
    env_file:
      - ./.env.base44-defaults
      - /run/base44/app.env
    depends_on:
      db:
        condition: service_healthy
    command: sh -c "npm ci --legacy-peer-deps && npx drizzle-kit push && npx tsx db/seed.ts && npm run dev -- --host"
